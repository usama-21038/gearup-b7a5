<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GearUp — Rent Sports & Outdoor Gear Instantly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --color-primary:#2563EB;
  --color-primary-dark:#1D4ED8;
  --color-primary-tint:#EFF4FF;
  --color-bg:#F8FAFC;
  --color-surface:#FFFFFF;
  --color-text:#0F172A;
  --color-text-secondary:#64748B;
  --color-border:#E2E8F0;
  --color-success:#16A34A;
  --color-success-tint:#DCFCE7;
  --color-success-text:#166534;
  --color-warning:#F59E0B;
  --color-warning-tint:#FEF3C7;
  --color-warning-text:#92400E;
  --color-error:#DC2626;
  --color-error-tint:#FEE2E2;
  --color-error-text:#991B1B;
  --color-purple:#7C3AED;
  --color-purple-tint:#EDE9FE;
  --color-purple-text:#5B21B6;
  --color-gray-tint:#F1F5F9;
  --color-gray-text:#475569;
  --r-sm:6px;
  --r-input:8px;
  --r-card:12px;
  --r-modal:16px;
  --r-section:20px;
  --r-pill:999px;
  --shadow-card:0 1px 2px rgba(15,23,42,0.06), 0 1px 1px rgba(15,23,42,0.04);
  --shadow-raised:0 8px 24px rgba(15,23,42,0.10);
  --shadow-modal:0 24px 64px rgba(15,23,42,0.24);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--color-bg);
  color:var(--color-text);
  -webkit-font-smoothing:antialiased;
  font-size:16px;
  line-height:1.5;
}
img,svg{display:block;max-width:100%;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
input,select,textarea{font-family:inherit;font-size:14px;}
::selection{background:var(--color-primary-tint);color:var(--color-primary-dark);}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px;border-radius:4px;}

.wrap{max-width:1180px;margin:0 auto;padding:0 24px;}
@media(max-width:640px){.wrap{padding:0 16px;}}

/* ---------- Typography ---------- */
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-0.02em;color:var(--color-text);}
.text-display{font-size:56px;line-height:1.06;font-weight:800;letter-spacing:-0.03em;}
.text-h1{font-size:40px;line-height:1.12;font-weight:800;letter-spacing:-0.02em;}
.text-h2{font-size:30px;line-height:1.2;font-weight:700;}
.text-h3{font-size:22px;line-height:1.3;font-weight:700;}
.text-body{font-size:16px;color:var(--color-text-secondary);}
.text-small{font-size:14px;color:var(--color-text-secondary);}
.text-caption{font-size:12px;color:var(--color-text-secondary);}
@media(max-width:640px){
  .text-display{font-size:36px;}
  .text-h1{font-size:30px;}
  .text-h2{font-size:24px;}
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:var(--r-input);
  font-weight:600;font-size:14px;
  padding:11px 20px;border:1px solid transparent;
  transition:background .15s ease, border-color .15s ease, color .15s ease, transform .05s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--color-primary);color:#fff;}
.btn-primary:hover{background:var(--color-primary-dark);}
.btn-primary:disabled{background:#94A9E8;cursor:not-allowed;}
.btn-secondary{background:var(--color-primary-tint);color:var(--color-primary-dark);}
.btn-secondary:hover{background:#E0EAFE;}
.btn-outline{background:transparent;color:var(--color-text);border-color:var(--color-border);}
.btn-outline:hover{border-color:var(--color-text-secondary);background:var(--color-gray-tint);}
.btn-destructive{background:#fff;color:var(--color-error);border-color:#F3C6C6;}
.btn-destructive:hover{background:var(--color-error-tint);}
.btn-destructive-solid{background:var(--color-error);color:#fff;}
.btn-destructive-solid:hover{background:#B91C1C;}
.btn-ghost{background:transparent;color:var(--color-text-secondary);padding:8px 10px;}
.btn-ghost:hover{background:var(--color-gray-tint);color:var(--color-text);}
.btn-sm{padding:7px 14px;font-size:13px;}
.btn-lg{padding:14px 28px;font-size:16px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.6;cursor:not-allowed;}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .6s linear infinite;}
.spinner-dark{border:2px solid rgba(15,23,42,.15);border-top-color:var(--color-primary);}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- Forms ---------- */
.field{margin-bottom:18px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--color-text);}
.field .req{color:var(--color-error);}
.field input[type=text],.field input[type=email],.field input[type=password],.field input[type=number],.field input[type=date],.field select,.field textarea{
  width:100%;padding:11px 14px;border:1px solid var(--color-border);border-radius:var(--r-input);
  background:#fff;color:var(--color-text);transition:border-color .15s ease, box-shadow .15s ease;
}
.field textarea{resize:vertical;min-height:88px;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-tint);outline:none;}
.field input:disabled{background:var(--color-gray-tint);color:var(--color-text-secondary);}
.field.has-error input,.field.has-error textarea{border-color:var(--color-error);}
.field.has-error input:focus{box-shadow:0 0 0 3px var(--color-error-tint);}
.field-help{font-size:12px;color:var(--color-text-secondary);margin-top:6px;}
.field-error{font-size:12px;color:var(--color-error);margin-top:6px;display:flex;align-items:center;gap:5px;}
.pw-wrap{position:relative;}
.pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--color-text-secondary);font-size:12px;font-weight:600;padding:4px 6px;}
.role-select{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.role-card{border:1.5px solid var(--color-border);border-radius:var(--r-card);padding:16px;cursor:pointer;transition:all .15s ease;}
.role-card:hover{border-color:#B9CCFB;}
.role-card.active{border-color:var(--color-primary);background:var(--color-primary-tint);}
.role-card .rc-title{font-weight:700;font-size:14px;margin-bottom:2px;}
.role-card .rc-desc{font-size:12px;color:var(--color-text-secondary);}

/* ---------- Card / Section ---------- */
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--r-card);box-shadow:var(--shadow-card);}
.section{padding:64px 0;}
.section-tight{padding:40px 0;}
@media(max-width:640px){.section{padding:40px 0;}}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--r-pill);border:1px solid transparent;}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge-PLACED{background:var(--color-warning-tint);color:var(--color-warning-text);}
.badge-CONFIRMED{background:var(--color-primary-tint);color:var(--color-primary-dark);}
.badge-PAID{background:var(--color-purple-tint);color:var(--color-purple-text);}
.badge-PICKED_UP{background:var(--color-success-tint);color:var(--color-success-text);}
.badge-RETURNED{background:var(--color-gray-tint);color:var(--color-gray-text);}
.badge-CANCELLED{background:var(--color-error-tint);color:var(--color-error-text);}
.badge-Active{background:var(--color-success-tint);color:var(--color-success-text);}
.badge-Suspended{background:var(--color-error-tint);color:var(--color-error-text);}
.badge-outline{background:#fff;border-color:var(--color-border);color:var(--color-text-secondary);}

/* ---------- Navbar ---------- */
.navbar{position:sticky;top:0;z-index:40;background:rgba(248,250,252,0.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--color-border);}
.navbar-inner{display:flex;align-items:center;justify-content:space-between;height:68px;}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-0.02em;}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--color-primary);display:flex;align-items:center;justify-content:center;}
.nav-links{display:flex;align-items:center;gap:28px;}
.nav-link{font-size:14px;font-weight:500;color:var(--color-text-secondary);}
.nav-link:hover{color:var(--color-text);}
.nav-link.active{color:var(--color-primary);}
.nav-actions{display:flex;align-items:center;gap:10px;}
.nav-burger{display:none;background:none;border:1px solid var(--color-border);border-radius:var(--r-input);width:38px;height:38px;align-items:center;justify-content:center;}
.user-chip{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 6px;border-radius:var(--r-pill);border:1px solid var(--color-border);background:#fff;}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--color-primary);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
@media(max-width:860px){
  .nav-links{display:none;}
  .nav-burger{display:flex;}
}

/* ---------- Mobile drawer ---------- */
.drawer-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.4);z-index:60;display:none;}
.drawer-overlay.open{display:block;}
.drawer{position:fixed;top:0;right:0;height:100%;width:280px;background:#fff;z-index:61;transform:translateX(100%);transition:transform .2s ease;padding:20px;overflow-y:auto;}
.drawer.open{transform:translateX(0);}
.drawer a,.drawer button{display:block;width:100%;text-align:left;padding:12px 10px;border-radius:var(--r-input);font-weight:600;font-size:15px;border:none;background:none;}
.drawer a:hover,.drawer button:hover{background:var(--color-gray-tint);}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;padding:88px 0 76px;border-bottom:1px solid var(--color-border);}
.hero-topo{position:absolute;inset:0;z-index:0;opacity:0.55;pointer-events:none;}
.hero-inner{position:relative;z-index:1;max-width:640px;}
.hero-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--color-primary-dark);background:var(--color-primary-tint);padding:6px 14px;border-radius:var(--r-pill);margin-bottom:20px;}
.hero h1{margin-bottom:18px;}
.hero p{margin-bottom:30px;max-width:480px;}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:36px;}
.hero-stats{display:flex;gap:36px;}
.hero-stat b{font-size:22px;display:block;letter-spacing:-0.02em;}
@media(max-width:640px){.hero{padding:56px 0 48px;}.hero-stats{gap:24px;}}

/* ---------- Category / feature grids ---------- */
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4{grid-template-columns:1fr 1fr;}.grid-3{grid-template-columns:1fr;}.grid-2{grid-template-columns:1fr;}}

.cat-card{border:1px solid var(--color-border);border-radius:var(--r-card);padding:20px;background:#fff;display:flex;flex-direction:column;gap:10px;transition:border-color .15s;}
.cat-card:hover{border-color:var(--color-primary);}
.cat-icon{width:40px;height:40px;border-radius:var(--r-sm);background:var(--color-primary-tint);display:flex;align-items:center;justify-content:center;color:var(--color-primary);}

.step-row{display:flex;gap:20px;counter-reset:step;}
.step{flex:1;position:relative;padding-left:0;}
.step-num{width:34px;height:34px;border-radius:50%;background:var(--color-text);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
@media(max-width:700px){.step-row{flex-direction:column;}}

/* ---------- Gear Card ---------- */
.gear-card{background:#fff;border:1px solid var(--color-border);border-radius:var(--r-card);overflow:hidden;transition:box-shadow .15s ease, transform .15s ease;display:flex;flex-direction:column;}
.gear-card:hover{box-shadow:var(--shadow-raised);transform:translateY(-2px);}
.gear-media{aspect-ratio:4/3;position:relative;display:flex;align-items:center;justify-content:center;}
.gear-media svg{width:52%;height:52%;}
.gear-avail-badge{position:absolute;top:10px;left:10px;}
.gear-body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1;}
.gear-cat{font-size:12px;color:var(--color-text-secondary);font-weight:600;}
.gear-name{font-size:16px;font-weight:700;letter-spacing:-0.01em;}
.gear-rating{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--color-text-secondary);}
.gear-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;}
.gear-price b{font-size:17px;color:var(--color-text);}
.gear-price span{font-size:12px;color:var(--color-text-secondary);}

/* ---------- Category tint backgrounds for gear media ---------- */
.tint-Cycling{background:#EFF4FF;color:#2563EB;}
.tint-Camping{background:#FEF3E8;color:#C2660D;}
.tint-Hiking{background:#EAF7EE;color:#16803C;}
.tint-Water_Sports{background:#E9F6FA;color:#0E7C91;}
.tint-Team_Sports{background:#FDEEF0;color:#C22B4E;}
.tint-Fitness{background:#F3EEFD;color:#6D28D9;}

/* ---------- Footer ---------- */
.footer{border-top:1px solid var(--color-border);padding:52px 0 28px;margin-top:40px;background:#fff;}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;margin-bottom:36px;}
.footer-grid h4{font-size:13px;margin-bottom:14px;}
.footer-grid a{display:block;font-size:14px;color:var(--color-text-secondary);margin-bottom:10px;}
.footer-grid a:hover{color:var(--color-text);}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;padding-top:24px;border-top:1px solid var(--color-border);font-size:13px;color:var(--color-text-secondary);}
@media(max-width:700px){.footer-grid{grid-template-columns:1fr 1fr;}.footer-bottom{flex-direction:column;gap:12px;align-items:flex-start;}}

/* ---------- Browse layout ---------- */
.browse-layout{display:grid;grid-template-columns:250px 1fr;gap:32px;align-items:start;}
@media(max-width:900px){.browse-layout{grid-template-columns:1fr;}}
.filter-panel{position:sticky;top:88px;}
.filter-group{margin-bottom:24px;}
.filter-group h4{font-size:13px;margin-bottom:12px;}
.chip-list{display:flex;flex-wrap:wrap;gap:8px;}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:7px 13px;border-radius:var(--r-pill);border:1px solid var(--color-border);background:#fff;cursor:pointer;font-weight:500;}
.chip.active{background:var(--color-text);color:#fff;border-color:var(--color-text);}
.filter-chip-x{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:var(--r-pill);background:var(--color-primary-tint);color:var(--color-primary-dark);font-weight:600;}
.range-val{display:flex;justify-content:space-between;font-size:13px;color:var(--color-text-secondary);margin-top:8px;}
.browse-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap;}
.search-input-wrap{position:relative;flex:1;min-width:200px;}
.search-input-wrap input{padding-left:38px;}
.search-input-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--color-text-secondary);}

/* ---------- Skeleton ---------- */
.skel{background:linear-gradient(90deg,#EEF1F5 25%,#F6F8FA 37%,#EEF1F5 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:var(--r-sm);}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
.skel-card{border:1px solid var(--color-border);border-radius:var(--r-card);overflow:hidden;background:#fff;}
.skel-media{aspect-ratio:4/3;}
.skel-line{height:12px;margin:14px 16px;}

/* ---------- Empty / error state ---------- */
.state-block{display:flex;flex-direction:column;align-items:center;text-align:center;padding:64px 24px;color:var(--color-text-secondary);}
.state-icon{width:56px;height:56px;border-radius:50%;background:var(--color-gray-tint);display:flex;align-items:center;justify-content:center;margin-bottom:18px;color:var(--color-text-secondary);}
.state-block h3{margin-bottom:8px;color:var(--color-text);}
.state-block p{max-width:340px;margin-bottom:20px;font-size:14px;}

/* ---------- Gear detail ---------- */
.detail-layout{display:grid;grid-template-columns:1.15fr 0.85fr;gap:40px;align-items:start;}
@media(max-width:900px){.detail-layout{grid-template-columns:1fr;}}
.gallery-main{aspect-ratio:4/3;border-radius:var(--r-card);overflow:hidden;margin-bottom:12px;}
.gallery-thumbs{display:flex;gap:10px;}
.gallery-thumb{width:64px;height:64px;border-radius:var(--r-sm);overflow:hidden;border:2px solid transparent;cursor:pointer;flex-shrink:0;}
.gallery-thumb.active{border-color:var(--color-primary);}
.rent-card{position:sticky;top:88px;padding:24px;}
.rent-card .price-row{display:flex;align-items:baseline;gap:6px;margin-bottom:4px;}
.rent-card .price-row b{font-size:28px;letter-spacing:-0.02em;}
.provider-row{display:flex;align-items:center;gap:10px;padding:14px 0;border-top:1px solid var(--color-border);border-bottom:1px solid var(--color-border);margin:16px 0;}
.calendar{border:1px solid var(--color-border);border-radius:var(--r-input);padding:14px;margin:14px 0;}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:700;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.cal-dow{font-size:11px;color:var(--color-text-secondary);font-weight:600;padding-bottom:4px;}
.cal-day{font-size:13px;padding:7px 0;border-radius:var(--r-sm);cursor:pointer;}
.cal-day:hover:not(.disabled):not(.empty){background:var(--color-gray-tint);}
.cal-day.disabled{color:#CBD5E1;cursor:not-allowed;text-decoration:line-through;}
.cal-day.empty{visibility:hidden;}
.cal-day.selected{background:var(--color-primary);color:#fff;font-weight:700;}
.cal-day.in-range{background:var(--color-primary-tint);color:var(--color-primary-dark);}
.price-breakdown{border-top:1px solid var(--color-border);padding-top:14px;margin-top:14px;}
.price-breakdown .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px;color:var(--color-text-secondary);}
.price-breakdown .row.total{color:var(--color-text);font-weight:700;font-size:16px;border-top:1px solid var(--color-border);padding-top:10px;margin-top:4px;}
.tab-row{display:flex;gap:4px;border-bottom:1px solid var(--color-border);margin:44px 0 24px;}
.tab-btn{padding:12px 18px;font-size:14px;font-weight:600;color:var(--color-text-secondary);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;}
.tab-btn.active{color:var(--color-primary);border-color:var(--color-primary);}
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 32px;}
.spec-row{display:flex;justify-content:space-between;font-size:14px;padding-bottom:10px;border-bottom:1px dashed var(--color-border);}
.spec-row span:first-child{color:var(--color-text-secondary);}
.review-item{display:flex;gap:12px;padding:18px 0;border-bottom:1px solid var(--color-border);}
.review-item:last-child{border-bottom:none;}
.stars{color:var(--color-warning);font-size:13px;letter-spacing:1px;}

/* ---------- Auth ---------- */
.auth-shell{min-height:calc(100vh - 68px);display:flex;align-items:center;justify-content:center;padding:56px 20px;}
.auth-card{width:100%;max-width:420px;padding:36px;}
.auth-head{text-align:center;margin-bottom:28px;}
.auth-foot{text-align:center;margin-top:20px;font-size:14px;color:var(--color-text-secondary);}
.auth-foot a{color:var(--color-primary);font-weight:600;}
.divider-or{text-align:center;font-size:12px;color:var(--color-text-secondary);margin:18px 0;position:relative;}

/* ---------- Dashboard layout ---------- */
.dash-shell{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 68px);}
@media(max-width:860px){.dash-shell{grid-template-columns:1fr;}}
.dash-sidebar{border-right:1px solid var(--color-border);padding:24px 16px;position:sticky;top:68px;height:calc(100vh - 68px);overflow-y:auto;background:#fff;}
@media(max-width:860px){.dash-sidebar{display:none;}}
.dash-role-tag{font-size:11px;font-weight:700;text-transform:none;color:var(--color-primary);background:var(--color-primary-tint);padding:5px 10px;border-radius:var(--r-pill);display:inline-block;margin-bottom:18px;}
.dash-nav a,.dash-nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-input);font-size:14px;font-weight:600;color:var(--color-text-secondary);margin-bottom:2px;width:100%;text-align:left;border:none;background:none;}
.dash-nav a:hover,.dash-nav button:hover{background:var(--color-gray-tint);color:var(--color-text);}
.dash-nav a.active{background:var(--color-primary-tint);color:var(--color-primary-dark);}
.dash-main{padding:32px;max-width:1100px;}
@media(max-width:640px){.dash-main{padding:20px 16px;}}
.dash-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;gap:16px;flex-wrap:wrap;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px;}
@media(max-width:900px){.stat-grid{grid-template-columns:1fr 1fr;}}
.stat-card{padding:18px 20px;}
.stat-card .stat-label{font-size:13px;color:var(--color-text-secondary);margin-bottom:8px;font-weight:600;}
.stat-card .stat-val{font-size:26px;font-weight:800;letter-spacing:-0.02em;}
.stat-card .stat-sub{font-size:12px;margin-top:6px;color:var(--color-text-secondary);}
.panel{padding:22px;margin-bottom:24px;}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;}
table.data-table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px;}
.data-table th{text-align:left;font-size:12px;font-weight:700;color:var(--color-text-secondary);padding:0 14px 10px;border-bottom:1px solid var(--color-border);white-space:nowrap;}
.data-table td{padding:14px;border-bottom:1px solid var(--color-border);vertical-align:middle;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:#FBFCFE;}
.cell-primary{font-weight:600;}
.cell-sub{font-size:12px;color:var(--color-text-secondary);}
.table-toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.mini-thumb{width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.row-flex{display:flex;align-items:center;gap:10px;}

/* ---------- Pagination ---------- */
.pagination{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:20px;}
.page-btn{width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--color-border);background:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;}
.page-btn.active{background:var(--color-text);color:#fff;border-color:var(--color-text);}

/* ---------- Order timeline ---------- */
.timeline{display:flex;flex-direction:column;}
.tl-item{display:flex;gap:14px;}
.tl-dot-col{display:flex;flex-direction:column;align-items:center;}
.tl-dot{width:12px;height:12px;border-radius:50%;background:var(--color-border);flex-shrink:0;margin-top:3px;}
.tl-dot.done{background:var(--color-primary);}
.tl-line{width:2px;flex:1;background:var(--color-border);min-height:28px;}
.tl-line.done{background:var(--color-primary);}
.tl-item .tl-body{padding-bottom:24px;}
.tl-item:last-child .tl-body{padding-bottom:0;}
.tl-title{font-weight:600;font-size:14px;}
.tl-time{font-size:12px;color:var(--color-text-secondary);margin-top:2px;}

/* ---------- Toast ---------- */
.toast-stack{position:fixed;bottom:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
@media(max-width:640px){.toast-stack{right:12px;left:12px;align-items:stretch;}}
.toast{display:flex;align-items:flex-start;gap:10px;background:var(--color-text);color:#fff;padding:14px 16px;border-radius:var(--r-input);box-shadow:var(--shadow-modal);min-width:280px;max-width:360px;animation:toast-in .18s ease;}
@keyframes toast-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.toast-icon{flex-shrink:0;margin-top:1px;}
.toast.success .toast-icon{color:#4ADE80;}
.toast.error .toast-icon{color:#F87171;}
.toast-msg{font-size:13px;font-weight:500;line-height:1.4;}
.toast-close{margin-left:auto;background:none;border:none;color:rgba(255,255,255,.6);flex-shrink:0;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:#fff;border-radius:var(--r-modal);box-shadow:var(--shadow-modal);width:100%;max-width:420px;padding:26px;}
.modal-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.modal-actions{display:flex;gap:10px;margin-top:22px;}
.modal-actions .btn{flex:1;}

/* ---------- misc ---------- */
.divider{height:1px;background:var(--color-border);border:none;margin:0;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.avail-dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.svg-icon{stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.trail-divider{height:28px;background-repeat:repeat-x;background-size:56px 28px;opacity:.5;}
.provider-avatar{width:38px;height:38px;border-radius:50%;background:var(--color-text);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.link-btn{background:none;border:none;color:var(--color-primary);font-weight:600;font-size:14px;padding:0;}
.mobile-hide{}
@media(max-width:640px){.mobile-hide{display:none !important;}}
.center-empty-icon{width:20px;height:20px;}
</style>
</head>

function fmt$(n){ return '$'+n.toFixed(2).replace(/\.00$/,''); }
function fmtDate(d){ const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function uid(prefix){ return prefix+'-'+Math.floor(10000+Math.random()*89999); }

function navigate(route, params={}){
  state.route=route; state.params=params; state.drawerOpen=false;
  window.scrollTo({top:0,behavior:'instant'});
  if(route==='browse'){ state.loadingBrowse=true; render(); setTimeout(()=>{state.loadingBrowse=false; render();},550); return; }
  if(route==='gear-detail'){ state.gearDetail={tab:'description',galleryIdx:0,calMonthOffset:0,selStart:null,selEnd:null}; }
  render();
}
function login(role){
  const names={Customer:'Ayesha Rahman',Provider:'Peak Cycles Rentals',Admin:'Jordan Reyes'};
  state.user={name:names[role],email:role.toLowerCase()+'@gearup.io',role};
  toast('success', 'Welcome back, '+names[role].split(' ')[0]+'.');
  if(role==='Customer') navigate('dashboard-customer');
  else if(role==='Provider') navigate('dashboard-provider');
  else navigate('dashboard-admin');
}
function logout(){ state.user=null; toast('success','Signed out.'); navigate('home'); }

/* ---------------- Toasts ---------------- */
function toast(type, msg){
  const id=Date.now()+Math.random();
  state.toasts.push({id,type,msg});
  renderToasts();
  setTimeout(()=>dismissToast(id), 4000);
}
function dismissToast(id){ state.toasts=state.toasts.filter(t=>t.id!==id); renderToasts(); }
function renderToasts(){
  const root=document.getElementById('toast-root');
  root.innerHTML=state.toasts.map(t=>`
    <div class="toast ${t.type}">
      <span class="toast-icon">${t.type==='success'?ICONS.checkCircle:ICONS.alertCircle}</span>
      <span class="toast-msg">${t.msg}</span>
      <button class="toast-close" onclick="dismissToast(${JSON.stringify(t.id)})">${ICONS.x}</button>
    </div>`).join('');
}

/* ---------------- Confirm dialog ---------------- */
function openConfirm(opts){ state.confirm=opts; renderModal(); }
function closeConfirm(){ state.confirm=null; renderModal(); }
function renderModal(){
  const root=document.getElementById('modal-root');
  if(!state.confirm){ root.innerHTML=''; return; }
  const c=state.confirm;
  const danger = c.tone==='danger';
  root.innerHTML=`
    <div class="modal-overlay" onclick="if(event.target===this) closeConfirm()">
      <div class="modal-box">
        <div class="modal-icon" style="background:${danger?'var(--color-error-tint)':'var(--color-primary-tint)'};color:${danger?'var(--color-error)':'var(--color-primary)'}">${c.icon||ICONS.alertCircle}</div>
        <h3 class="text-h3">${c.title}</h3>
        <p class="text-small" style="margin-top:8px;">${c.body}</p>
        <div class="modal-actions">
          <button class="btn btn-outline btn-block" onclick="closeConfirm()">${c.cancelLabel||'Cancel'}</button>
          <button class="btn ${danger?'btn-destructive-solid':'btn-primary'} btn-block" onclick="(${c.onConfirmName})(); closeConfirm();">${c.confirmLabel}</button>
        </div>
      </div>
    </div>`;
}

function matchesFilters(g){
  const f=state.filters;
  if(f.search && !g.name.toLowerCase().includes(f.search.toLowerCase()) && !g.brand.toLowerCase().includes(f.search.toLowerCase())) return false;
  if(f.category!=='All' && g.category!==f.category) return false;
  if(g.price>f.priceMax) return false;
  if(f.availability==='available' && !g.available) return false;
  return true;
}
function pageBrowse(){
  const f=state.filters;
  const results = GEAR.filter(matchesFilters);
  const chips=[];
  if(f.category!=='All') chips.push({label:f.category,clear:"state.filters.category='All'"});
  if(f.search) chips.push({label:'"'+f.search+'"',clear:"state.filters.search='';document.getElementById('browse-search').value=''"});
  if(f.availability==='available') chips.push({label:'Available now',clear:"state.filters.availability='any'"});
  if(f.priceMax<50) chips.push({label:'Under '+fmt$(f.priceMax)+'/day',clear:"state.filters.priceMax=50"});

  const sidebar = `
    <div class="filter-panel">
      <div class="filter-group">
        <h4>Category</h4>
        <div class="chip-list">
          <span class="chip ${f.category==='All'?'active':''}" onclick="state.filters.category='All';renderBrowseResults()">All</span>
          ${CATEGORIES.map(c=>`<span class="chip ${f.category===c?'active':''}" onclick="state.filters.category='${c}';renderBrowseResults()">${c}</span>`).join('')}
        </div>
      </div>
      <div class="filter-group">
        <h4>Price per day</h4>
        <input type="range" min="5" max="50" step="1" value="${f.priceMax}" style="width:100%" oninput="state.filters.priceMax=parseInt(this.value);renderBrowseResults()">
        <div class="range-val"><span>$5</span><span>Up to ${fmt$(f.priceMax)}</span></div>
      </div>
      <div class="filter-group">
        <h4>Brand</h4>
        <select onchange="state.filters.search=this.value==='All'?'':this.value;renderBrowseResults()">
          <option value="All">All brands</option>
          ${[...new Set(GEAR.map(g=>g.brand))].sort().map(b=>`<option ${f.search===b?'selected':''}>${b}</option>`).join('')}
        </select>
      </div>
      <div class="filter-group">
        <h4>Availability</h4>
        <div class="chip-list">
          <span class="chip ${f.availability==='any'?'active':''}" onclick="state.filters.availability='any';renderBrowseResults()">Any</span>
          <span class="chip ${f.availability==='available'?'active':''}" onclick="state.filters.availability='available';renderBrowseResults()">Available now</span>
        </div>
      </div>
      <button class="btn btn-outline btn-block btn-sm" onclick="state.filters={search:'',category:'All',priceMax:50,availability:'any'};document.getElementById('browse-search').value='';renderBrowseResults()">Clear all filters</button>
    </div>`;

  return `
  ${Navbar()}
  <div class="section-tight">
    <div class="wrap">
      <div style="margin-bottom:22px;">
        <h1 class="text-h1">Browse gear</h1>
        <p class="text-body">Sports and outdoor equipment, ready to rent near you.</p>
      </div>
      <div class="browse-layout">
        <div class="mobile-hide">${sidebar}</div>
        <div>
          <div class="browse-toolbar">
            <div class="search-input-wrap">
              ${ICONS.search}
              <input id="browse-search" type="text" placeholder="Search gear or brand..." value="${f.search && CATEGORIES.concat([...new Set(GEAR.map(g=>g.brand))]).includes(f.search)?'':f.search}" oninput="state.filters.search=this.value;renderBrowseResults()">
            </div>
            <button class="btn btn-outline mobile-only-flex" style="display:none" id="mobile-filter-btn" onclick="openMobileFilters()">${ICONS.filter} Filters</button>
            <select onchange="renderBrowseResults()" id="browse-sort" style="border:1px solid var(--color-border);border-radius:var(--r-input);padding:11px 14px;">
              <option value="rec">Sort: Recommended</option>
              <option value="low">Price: Low to high</option>
              <option value="high">Price: High to low</option>
              <option value="rating">Highest rated</option>
            </select>
          </div>
          ${chips.length?`<div class="chip-list" style="margin-bottom:16px;">${chips.map(c=>`<span class="filter-chip-x">${c.label}<span style="cursor:pointer" onclick="${c.clear};renderBrowseResults()">${ICONS.x}</span></span>`).join('')}</div>`:''}
          <div id="browse-results"></div>
        </div>
      </div>
    </div>
  </div>
  ${Footer()}
  `;

function renderBrowseResults(){
  const container=document.getElementById('browse-results');
  if(!container) return;
  if(state.loadingBrowse){
    container.innerHTML=`<div class="grid-3">${Array(6).fill(0).map(gearCardSkeleton).join('')}</div>`;
    return;
  }
  let results = GEAR.filter(matchesFilters);
  const sortSel=document.getElementById('browse-sort');
  const sortVal = sortSel?sortSel.value:'rec';
  if(sortVal==='low') results=results.slice().sort((a,b)=>a.price-b.price);
  if(sortVal==='high') results=results.slice().sort((a,b)=>b.price-a.price);
  if(sortVal==='rating') results=results.slice().sort((a,b)=>b.rating-a.rating);

  const countLine=`<p class="text-small" style="margin-bottom:16px;">${results.length} item${results.length!==1?'s':''} found</p>`;
  if(results.length===0){
    container.innerHTML = countLine + `
      <div class="state-block card">
        <div class="state-icon">${ICONS.search}</div>
        <h3>No gear found</h3>
        <p>Try a different category, a higher price range, or clear your filters to see everything we have.</p>
        <button class="btn btn-primary btn-sm" onclick="state.filters={search:'',category:'All',priceMax:50,availability:'any'};document.getElementById('browse-search').value='';renderBrowseResults()">Clear filters</button>
      </div>`;
    return;
  }
  container.innerHTML = countLine + `<div class="grid-3">${results.map(gearCard).join('')}</div>`;
}

/* ---- Calendar widget for rental date selection ---- */
function renderCalendar(g){
  const d=state.gearDetail;
  const today=new Date(); today.setHours(0,0,0,0);
  const base=new Date(today.getFullYear(), today.getMonth()+d.calMonthOffset, 1);
  const monthLabel=base.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const firstDow=base.getDay();
  const daysInMonth=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
  // deterministic pseudo-unavailable days based on gear id
  const unavailable=new Set();
  for(let i=0;i<3;i++){ unavailable.add(((g.id*7)+i*5)%daysInMonth + 1); }

  let cells='';
  for(let i=0;i<firstDow;i++) cells+=`<div class="cal-day empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateObj=new Date(base.getFullYear(),base.getMonth(),day);
    const iso=dateObj.toISOString().slice(0,10);
    const isPast = dateObj < today;
    const isUnavail = unavailable.has(day);
    const disabled = isPast || isUnavail;
    let cls='cal-day';
    if(disabled) cls+=' disabled';
    if(d.selStart===iso || d.selEnd===iso) cls+=' selected';
    else if(d.selStart && d.selEnd && iso>d.selStart && iso<d.selEnd) cls+=' in-range';
    cells+=`<div class="${cls}" ${disabled?'':`onclick="pickDate('${iso}')"`}>${day}</div>`;
  }
  return `
  <div class="calendar">
    <div class="cal-head">
      <button class="btn btn-ghost btn-sm" style="padding:2px 6px" onclick="state.gearDetail.calMonthOffset=Math.max(0,state.gearDetail.calMonthOffset-1);document.getElementById('rent-calendar').innerHTML=renderCalendar(GEAR.find(x=>x.id===${g.id}))">${ICONS.chevronLeft}</button>
      <span>${monthLabel}</span>
      <button class="btn btn-ghost btn-sm" style="padding:2px 6px" onclick="state.gearDetail.calMonthOffset+=1;document.getElementById('rent-calendar').innerHTML=renderCalendar(GEAR.find(x=>x.id===${g.id}))">${ICONS.chevronRight}</button>
    </div>
    <div class="cal-grid">
      ${['S','M','T','W','T','F','S'].map(x=>`<div class="cal-dow">${x}</div>`).join('')}
      ${cells}
    </div>
    <p class="text-caption" style="margin-top:8px;">Crossed-out dates are already booked or in the past.</p>
  </div>`;
}
function pickDate(iso){
  const d=state.gearDetail;
  if(!d.selStart || (d.selStart && d.selEnd)){ d.selStart=iso; d.selEnd=null; }
  else if(iso<d.selStart){ d.selEnd=d.selStart; d.selStart=iso; }
  else if(iso===d.selStart){ d.selStart=null; d.selEnd=null; }
  else { d.selEnd=iso; }
  renderApp();
}
function startCheckout(gearId){
  const d=state.gearDetail;
  if(!d.selStart || !d.selEnd){ toast('error','Select a pickup and return date first.'); return; }
  const g=GEAR.find(x=>x.id===gearId);
  const days=daysBetween(d.selStart,d.selEnd);
  const order={ id: uid('GU'), gearId:g.id, gear:g.name, provider:g.provider, start:d.selStart, end:d.selEnd, days, pricePerDay:g.price, total: Math.round((days*g.price*1.08)*100)/100, status:'PLACED', placedAt:'Just now' };
  customerOrders.unshift(order);
  toast('success','Rental request placed — head to checkout to pay.');
  navigate('order-detail',{id:order.id});
}

function pageOrderDetail(){
  const o = customerOrders.find(x=>x.id===state.params.id);

  const steps = [

    {key:'CONFIRMED',label:'Confirmed by provider',time:o.status!=='PLACED'?'Confirmed':null},
    {key:'PAID',label:'Payment received',time:['PAID','PICKED_UP','RETURNED'].includes(o.status)?'Paid':null},
    {key:'PICKED_UP',label:'Picked up',time:['PICKED_UP','RETURNED'].includes(o.status)?'Picked up':null},
    {key:'RETURNED',label:'Returned',time:o.status==='RETURNED'?'Completed':null},
  ];
  const order_index = {PLACED:0,CONFIRMED:1,PAID:2,PICKED_UP:3,RETURNED:4,CANCELLED:-1}[o.status];
  return `
  ${Navbar()}
  <div class="section-tight">
    <div class="wrap" style="max-width:760px;">
      <button class="btn btn-ghost btn-sm" style="padding-left:0;margin-bottom:12px;" onclick="navigate('customer-orders')">${ICONS.arrowLeft} Back to orders</button>
      <div class="flex-between" style="margin-bottom:20px;flex-wrap:wrap;gap:10px;">
        <div><h1 class="text-h2">Order ${o.id}</h1><p class="text-small">Placed ${o.placedAt}</p></div>
        ${statusBadge(o.status)}
      </div>

      <div class="grid-2" style="align-items:start;">
        <div class="card panel">
          <h3 class="text-h3" style="margin-bottom:16px;">Order summary</h3>
          <div style="display:flex;gap:14px;margin-bottom:16px;">
            <div class="mini-thumb ${catClass(g?g.category:'Cycling')}" style="width:56px;height:56px;">${catIcon(g?g.category:'Cycling')}</div>
            <div><div style="font-weight:700;">${o.gear}</div><div class="text-small">${o.provider}</div></div>
          </div>
          <div class="spec-row"><span>Rental dates</span><span style="font-weight:600;">${fmtDate(o.start)} \u2013 ${fmtDate(o.end)}</span></div>
          <div class="spec-row"><span>Duration</span><span style="font-weight:600;">${o.days} day${o.days===1?'':'s'}</span></div>
          <div class="spec-row"><span>Price / day</span><span style="font-weight:600;">${fmt$(o.pricePerDay)}</span></div>
          <div class="spec-row" style="border-bottom:none;"><span>Total</span><span style="font-weight:700;font-size:16px;">${fmt$(o.total)}</span></div>
          ${o.status==='CONFIRMED'?`<button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="navigate('order-pay',{id:'${o.id}'})">Pay now</button>`:''}
          ${o.status==='RETURNED' && !o.reviewed?`<button class="btn btn-secondary btn-block" style="margin-top:16px;" onclick="openReviewModal('${o.id}')">Leave a review</button>`:''}
          ${o.status==='RETURNED' && o.reviewed?`<div class="text-small" style="margin-top:14px;color:var(--color-success-text);">${ICONS.checkCircle} Review submitted</div>`:''}
        </div>
        <div class="card panel">
          <h3 class="text-h3" style="margin-bottom:18px;">Order timeline</h3>
          ${o.status==='CANCELLED'? `<div class="text-small">${ICONS.xCircle} This order was cancelled and no charges were made.</div>` : `
          <div class="timeline">
            ${steps.map((s,i)=>`
              <div class="tl-item">
                <div class="tl-dot-col"><div class="tl-dot ${i<=order_index?'done':''}"></div>${i<steps.length-1?`<div class="tl-line ${i<order_index?'done':''}"></div>`:''}</div>
                <div class="tl-body"><div class="tl-title" style="${i<=order_index?'':'color:var(--color-text-secondary)'}">${s.label}</div>${s.time?`<div class="tl-time">${s.time}</div>`:''}</div>
              </div>`).join('')}
          </div>`}
        </div>
      </div>
    </div>
  </div>
  ${Footer()}
  `;
}
function openReviewModal(orderId){
  state.confirm=null;
  const root=document.getElementById('modal-root');
  root.innerHTML=`
    <div class="modal-overlay" onclick="if(event.target===this) closeConfirm()">
      <div class="modal-box">
        <h3 class="text-h3" style="margin-bottom:14px;">Leave a review</h3>
        <div class="field"><label>Rating</label>
          <div style="display:flex;gap:6px;font-size:24px;color:var(--color-warning);cursor:pointer;" id="star-picker">
            ${[1,2,3,4,5].map(n=>`<span onclick="setStarRating(${n})" data-star="${n}">\u2606</span>`).join('')}
          </div>
        </div>
        <div class="field"><label>Your review</label><textarea placeholder="How was the gear and the rental experience?"></textarea></div>
        <div class="modal-actions">
          <button class="btn btn-outline btn-block" onclick="closeConfirm()">Cancel</button>
          <button class="btn btn-primary btn-block" onclick="submitReview('${orderId}')">Submit review</button>
        </div>
      </div>
    </div>`;
  state.confirm={placeholder:true};
}
function setStarRating(n){
  document.querySelectorAll('#star-picker span').forEach(s=>{ s.textContent = parseInt(s.dataset.star)<=n ? '\u2605' : '\u2606'; });
  document.getElementById('star-picker').dataset.rating=n;
}
function submitReview(orderId){
  const o=customerOrders.find(x=>x.id===orderId); if(o) o.reviewed=true;
  closeConfirm();
  toast('success','Review submitted — thanks for the feedback!');
  render();
}

function providerOrderAction(o){

  if(o.status==='PAID') return `<button class="btn btn-primary btn-sm" onclick="updateProviderOrder('${o.id}','PICKED_UP','Marked as picked up')">Mark picked up</button>`;
  if(o.status==='PICKED_UP') return `<button class="btn btn-secondary btn-sm" onclick="confirmMarkReturned('${o.id}')">Mark returned</button>`;
  return `<span class="text-caption">\u2014</span>`;

function updateProviderOrder(id, newStatus, msg){
  const o=providerOrders.find(x=>x.id===id);
  if(o) o.status=newStatus;
  // reflect on customer-side mirror order if present

  if(co) co.status=newStatus;
  toast('success', msg+'.');
  render();
}

function saveGearForm(existingId){
  const name=document.getElementById('gf-name').value.trim();
  const price=parseFloat(document.getElementById('gf-price').value);
  const stock=parseInt(document.getElementById('gf-stock').value);
  if(!name || !price || isNaN(stock)){ toast('error','Fill in gear name, price, and stock to continue.'); return; }
  const btn=document.getElementById('gf-save-btn');
  btn.disabled=true; btn.innerHTML=`<span class="spinner"></span> Saving...`;
  setTimeout(()=>{
    const data={
      name, category:document.getElementById('gf-cat').value, brand:document.getElementById('gf-brand').value||'GearUp',
      description:document.getElementById('gf-desc').value||'No description provided yet.',
      price, stock, available:document.getElementById('gf-avail').checked,
      provider:state.user.name, location:'Denver, CO', rating:4.5, reviewCount:0,
      specs:{'Condition':'Good','Listed by':state.user.name},
    };
    if(existingId){
      const idx=providerInventory.findIndex(x=>x.id===existingId);
      providerInventory[idx]={...providerInventory[idx], ...data};
      toast('success','Gear updated.');
    } else {
      const newItem={...data, id: Math.max(...GEAR.map(g=>g.id),...providerInventory.map(g=>g.id))+1};
      providerInventory.unshift(newItem);
      GEAR.unshift(newItem);
      toast('success','New gear listed.');
    }
    navigate('provider-inventory');
  }, 650);
}

function pageAdminUsers(){
  const q=(state.adminUserSearch||'').toLowerCase();
  const roleF=state.adminRoleFilter||'All';
  const statusF=state.adminStatusFilter||'All';
  let rows=adminUsers.filter(u=>
    (!q || u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)) &&
    (roleF==='All'||u.role===roleF) && (statusF==='All'||u.status===statusF));
  return `
  ${Navbar()}
  <div class="dash-shell">
    ${dashSidebar(adminSidebarItems(),'users')}
    <div class="dash-main">
      <div class="dash-header"><div><h1 class="text-h1">User management</h1><p class="text-body">Search, filter, and moderate GearUp accounts.</p></div></div>
      <div class="card panel">
        <div class="table-toolbar">
          <div class="search-input-wrap" style="max-width:280px;">${ICONS.search}<input type="text" placeholder="Search name or email..." value="${state.adminUserSearch||''}" oninput="state.adminUserSearch=this.value;renderApp()"></div>
          <div style="display:flex;gap:8px;">
            <select style="border:1px solid var(--color-border);border-radius:var(--r-input);padding:9px 12px;" onchange="state.adminRoleFilter=this.value;renderApp()">
              <option ${roleF==='All'?'selected':''}>All</option>
              <option ${roleF==='Customer'?'selected':''}>Customer</option>
              <option ${roleF==='Provider'?'selected':''}>Provider</option>
            </select>
            <select style="border:1px solid var(--color-border);border-radius:var(--r-input);padding:9px 12px;" onchange="state.adminStatusFilter=this.value;renderApp()">
              <option ${statusF==='All'?'selected':''}>All</option>
              <option ${statusF==='Active'?'selected':''}>Active</option>
              <option ${statusF==='Suspended'?'selected':''}>Suspended</option>
            </select>
          </div>
        </div>
        ${rows.length? `<div class="table-wrap"><table class="data-table">
          <thead><tr><th>User</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th></th></tr></thead>
          <tbody>${rows.map(u=>`
            <tr>
              <td><div class="row-flex"><div class="avatar" style="background:${u.role==='Provider'?'var(--color-purple)':'var(--color-primary)'}">${initials(u.name)}</div><span class="cell-primary">${u.name}</span></div></td>
              <td class="text-small">${u.email}</td>
              <td>${u.role}</td>
              <td>${userStatusBadge(u.status)}</td>
              <td class="text-small">${u.joined}</td>
              <td style="text-align:right;">
                ${u.status==='Active'
                  ? `<button class="btn btn-destructive btn-sm" onclick="confirmUserAction(${u.id},'Suspended')">Suspend</button>`
                  : `<button class="btn btn-secondary btn-sm" onclick="confirmUserAction(${u.id},'Active')">Activate</button>`}
              </td>
            </tr>`).join('')}</tbody>
        </table></div>
        <div class="pagination"><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">${ICONS.chevronRight}</button></div>
        ` : emptyState('No matching users','Try a different search term or clear your filters.', null, '')}
      </div>
    </div>
  </div>
  ${Footer()}
  `;
}
function confirmUserAction(id, newStatus){
  const u=adminUsers.find(x=>x.id===id);
  const suspending = newStatus==='Suspended';
  openConfirm({
    title:(suspending?'Suspend ':'Activate ')+u.name+'?',
    body: suspending ? 'This user will immediately lose access to their GearUp account and any active listings will be hidden.' : 'This will restore full account access for this user.',
    icon: suspending?ICONS.shield:ICONS.checkCircle, tone: suspending?'danger':'',
    confirmLabel: suspending?'Suspend user':'Activate user',
    onConfirmName:`()=>setUserStatus(${id},'${newStatus}')`,
  });
}
function setUserStatus(id,status){
  const u=adminUsers.find(x=>x.id===id); u.status=status;
  toast('success', u.name+' '+(status==='Active'?'reactivated.':'suspended.'));
  render();
}

   ROUTER / RENDER
   ============================================================ */
const PAGES = {
  'home': pageHome,
  'browse': pageBrowse,
  'gear-detail': pageGearDetail,
  'login': pageLogin,
  'register': pageRegister,
  'dashboard-customer': pageDashboardCustomer,
  'customer-orders': pageCustomerOrders,
  'customer-payments': pageCustomerPayments,
  'customer-reviews': pageCustomerReviews,
  'customer-profile': pageCustomerProfile,
  'order-detail': pageOrderDetail,
  'order-pay': pageOrderPay,
  'payment-success': pagePaymentSuccess,
  'payment-cancel': pagePaymentCancel,
  'dashboard-provider': pageDashboardProvider,
  'provider-inventory': pageProviderInventory,
  'provider-gear-new': pageProviderGearForm,
  'provider-gear-edit': pageProviderGearForm,
  'provider-orders': pageProviderOrders,
  'provider-profile': pageProviderProfile,
  'dashboard-admin': pageDashboardAdmin,
  'admin-users': pageAdminUsers,
  'admin-gear': pageAdminGear,
  'admin-orders': pageAdminOrders,
  'admin-profile': pageAdminProfile,
};
// Route protection: dashboard routes require correct role
const ROLE_FOR_ROUTE = {};
['dashboard-customer','customer-orders','customer-payments','customer-reviews','customer-profile','order-detail','order-pay','payment-success','payment-cancel'].forEach(r=>ROLE_FOR_ROUTE[r]='Customer');
['dashboard-provider','provider-inventory','provider-gear-new','provider-gear-edit','provider-orders','provider-profile'].forEach(r=>ROLE_FOR_ROUTE[r]='Provider');
['dashboard-admin','admin-users','admin-gear','admin-orders','admin-profile'].forEach(r=>ROLE_FOR_ROUTE[r]='Admin');

function renderApp(){
  const required = ROLE_FOR_ROUTE[state.route];
  if(required && (!state.user || state.user.role!==required)){
    document.getElementById('app').innerHTML = pageLogin();
    toast('error','Please log in to view that page.');
    renderDrawer(); renderToasts(); renderModal();
    return;
  }
  const pageFn = PAGES[state.route] || pageHome;
  document.getElementById('app').innerHTML = pageFn();
  if(state.route==='browse'){ renderBrowseResults(); }
  renderDrawer(); renderToasts(); renderModal();
}
function render(){ renderApp(); }

render();
</script>
